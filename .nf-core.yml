lint:
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-nanotranseq_logo_light.png
    - docs/images/nf-core-nanotranseq_logo_light.png
    - docs/images/nf-core-nanotranseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-nanotranseq_logo_light.png
    - docs/images/nf-core-nanotranseq_logo_light.png
    - docs/images/nf-core-nanotranseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  multiqc_config:
    - report_comment
  nextflow_config:
    - manifest.name
    - manifest.homePage
nf_core_version: 4.1.0
template_strings: false
repository_type: pipeline
template:
  author: Karla Alejandra Ruiz Ceja, Leandro Tiburske
  description: "Analysis of cDNA and direct RNA long-read sequencing data "
  force: false
  is_nfcore: false
  name: nanotranseq
  org: nfdata-omics
  outdir: .
  skip_features:
    - gpu
  version: 1.0.0dev
